name: Split Changelog Data

on:
  push:
    paths:
      - '**/changelog-data.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate paginated changelog files
        run: |
          node tools/split-changelog.js zh-cn/apps/ling/changelog-data.js 5
          node tools/split-changelog.js en-us/apps/ling/changelog-data.js 5

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/changelog-meta.js' '**/changelog-page-*.js'
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "chore: regenerate paginated changelog files"
            git push
          fi
